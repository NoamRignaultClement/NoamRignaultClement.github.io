<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noam R.C.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://use.typekit.net/ehp0bwx.css">
  <link rel="canonical" href="https://noamrc.com/">
  <style>
    /* Base styles */
    body { background:#000; color:#f3f4f6; font-family:"ofelia-text",sans-serif; font-weight:400; font-style:normal; -webkit-font-smoothing:antialiased; }
    h1,h2,h3,h4,h5,h6 { font-family:"bodega-serif",serif; font-weight:300; letter-spacing:.05em;}
    header, header * { font-family:"ofelia-text",sans-serif; font-weight:400; font-style:normal; }
    figcaption { font-family:"bodega-serif",serif; font-size: 30px; font-weight:300; letter-spacing:.5em;}
    
    /* Animation Classes */
    .fade-in { opacity:0; filter:blur(20px); transition:opacity 1.2s ease, filter 1.2s ease; }
    .fade-in.visible { opacity:1; filter:blur(0); }
    .scroll-fade {
      opacity:0;
      filter:blur(18px);
      transform:translateY(24px);
      transition: opacity .8s ease, filter .8s ease, transform .8s ease;
    }
    .scroll-fade.visible {
      opacity:1;
      filter:blur(0);
      transform:translateY(0);
    }

    /* Arrow fade-in faster */
    #scroll-down.fade-in { transition: opacity 1.6s ease, filter 1.6s ease; }

    /* Header Classes */
    header { transition: opacity .6s ease, transform .6s ease; }
    .header-fade { opacity:0; transform:translateY(-12px); pointer-events:none; } 

    /* Poster Styles */
    #posters figure img { transition:transform .5s cubic-bezier(.22,.8,.28,1), box-shadow .3s; cursor:pointer; }
    #posters figure:hover img { transform:scale(1.05); box-shadow:0 20px 40px rgba(0,0,0,.6); }
    /* Uniform spacing handled with section padding classes */

    /* Client boxes hover (same as posters) */
    #client figure img,
    #client figure > div {
      transition: transform .5s cubic-bezier(.22,.8,.28,1), box-shadow .3s;
      cursor: pointer;
    }
    #client figure:hover img,
    #client figure:hover > div {
      transform: scale(1.05);
      box-shadow: 0 20px 40px rgba(0,0,0,.6);
    }
  </style>
</head>
<body class="text-gray-100">

  <!-- Inject shared header once -->
  <div id="header-container"></div>

  <main>
      <section id="hero" class="h-screen min-h-[700px] flex flex-col justify-center items-center text-center pt-16 px-4 relative overflow-hidden">
    <video autoplay muted loop playsinline class="absolute inset-0 w-full h-full object-cover z-0" style="pointer-events:none;">
      <source src="public/media/website-v1.webm" type="video/webm">
      <source src="public/media/Website-v1.mp4" type="video/mp4">
    </video>
    <div id="hero-content" class="fade-in relative z-10">
      <img src="public/media/NoamRC.webp" alt="NOAM R.C." class="mx-auto w-[70%] sm:w-[30%] h-auto">
      <p class="md:text-sm text-gray-400 mt-5 tracking-">BAY AREA FILMMAKER</p>
    </div>
    <!-- Down arrow to scroll to Narrative section -->
    <button id="scroll-down" aria-label="Scroll to Narrative Work"
            class="fade-in absolute bottom-8 left-1/2 -translate-x-1/2 z-10 inline-flex items-center justify-center w-12 h-12 rounded-full bg-black/40 hover:bg-black/60 transition group">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
           class="w-6 h-6 text-white transform transition-transform duration-300 ease-out group-hover:scale-110" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M6 9l6 6 6-6" />
      </svg>
    </button>
  </section>

      <section id="posters" class="py-12">
          <div class="container mx-auto max-w-7xl px-4">
               <img id="narrative-title" src="/public/media/NarrativeWork.png" alt="Narrative Work" class="scroll-fade mx-auto mb-8 w-[80%] md:w-[30%] h-auto">
               <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                 <figure class="flex flex-col items-center">
                  <!-- Link Little Things poster to YouTube -->
                  <a href="https://youtu.be/9s_Wx-_HwbM?si=NhzKJNl78EEfd4v0" target="_blank" rel="noopener">
                    <img src="/public/media/LittleThingsPoster.png" alt="Little Things poster" class="rounded shadow-lg">
                  </a>
                   <figcaption class="mt-4 tracking-wider text-gray-300">LITTLE THINGS | 2025</figcaption>
                   <p class="text-xs text-gray-400">CREATOR</p>
                 </figure>
                 <figure class="flex flex-col items-center">
                   <!-- Path fixed: absolute path and using TBM-poster.png -->
                   <a href="https://youtu.be/SHow5jzfGPk?si=5Uar0gGefhQD6C5_" target="_blank" rel="noopener">
                     <img src="/public/media/TBM-poster.png" alt="TBM Poster" class="rounded shadow-lg">
                   </a>
                   <figcaption class="mt-4 tracking-wider text-gray-300">THE BUTTERCUP MAFIA | 2025</figcaption>
                   <p class="text-xs text-gray-400">WRITER / DIRECTOR / EDITOR</p>                        
                 </figure>
                 <!-- Swapped: Wooden Heart in third slot -->
                 <figure class="flex flex-col items-center">
                   <a href="https://youtu.be/RENirxeFjMg?si=6WWjyhu4qKZvQXFN" target="_blank" rel="noopener">
                     <img src="public/media/WoodenHeartPoster.png" alt="Wooden Heart poster" class="rounded shadow-lg">
                   </a>
                   <figcaption class="mt-4 tracking-wider text-gray-300">THE WOODEN HEART | 2024</figcaption>
                   <p class="text-xs text-gray-400">CREATOR</p>
                 </figure>
                 <!-- Swapped: Fragments in fourth slot -->
                 <figure class="flex flex-col items-center">
                   <a href="https://youtu.be/NeOcDrghCdk?si=x7mjU8FWMs5yhJLe" target="_blank" rel="noopener">
                     <img src="/public/media/FragmentsPoster.png" alt="Fragments Poster" class="rounded shadow-lg">
                   </a>
                   <figcaption class="mt-4 tracking-wider text-gray-300">FRAGMENTS | 2024</figcaption>
                   <p class="text-xs text-gray-400">WRITER / DIRECTOR / EDITOR</p> 
                 </figure>
             </div>
          </div>
      </section>

      <!-- Client Work (three 16:9 boxes) -->
      <section id="client" class="pt-3 pb-16 mb-24 md:mb-40">
        <div class="container mx-auto max-w-7xl px-4">
          <img id="client-title" src="/public/media/ClientWork.png" alt="Client Work" class="scroll-fade mx-auto mb-12 w-[80%] md:w-[30%] h-auto">
           <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <figure class="flex flex-col items-center">
              <a href="https://youtu.be/TQw5ns8wTbQ" target="_blank" rel="noopener" class="w-full aspect-[16/9] rounded-lg overflow-hidden block">
                <img src="/public/media/Jameswareframe2.webp" alt="Jameswear" class="w-full h-full object-cover">
              </a>
               <figcaption class="mt-4 tracking-wider text-gray-300"> JAMESWEAR </figcaption>
               <p class="text-xs text-gray-400">COMMERCIAL</p>
            </figure>
            <figure class="flex flex-col items-center">
              <div class="w-full aspect-[16/9] rounded-lg overflow-hidden">
                <a href="https://youtu.be/h2RzUfyxB4w?si=pDNRObKdpL773O8s" target="_blank" rel="noopener">
                  <img src="/public/media/Frame3.webp" alt="Volkswagen" class="w-full h-full object-cover">
                </a>
              </div>
               <figcaption class="mt-4 tracking-wider text-gray-300"> VOLKSWAGEN</figcaption>
               <p class="text-xs text-gray-400">SPEC AD</p>
            </figure>
            <figure class="flex flex-col items-center">
              <div class="w-full aspect-[16/9] rounded-lg overflow-hidden">
                <a href="https://www.youtube.com/watch?v=4mEtZljZjI4" target="_blank" rel="noopener">
                  <img src="/public/media/MarinTreks.webp" alt="Marin Treks" class="w-full h-full object-cover">
                </a>
              </div>
               <figcaption class="mt-4 tracking-wider text-gray-300">MARIN TREKS</figcaption>
               <p class="text-xs text-gray-400">FEATURETTE</p>
             </figure>
          </div>
        </div>
      </section>
  </main>

  <footer class="py-16 border-t border-gray-800">
      <div class="container mx-auto max-w-7xl px-4 text-center">
          <!-- Path fixed: absolute path -->
          <img src="/public/media/NRCLOGO_v2.png" alt="Logo" class="h-16 mx-auto mb-6">
          <p class="text-gray-100 text-md tracking-wider">2025 - NOAM R.C.</p>
      </div>
  </footer>

  <script>
    // Inject header.html so only one header/logo appears
    (async () => {
      const res = await fetch('header.html');
      const html = await res.text();
      document.getElementById('header-container').innerHTML = html;

      const header = document.querySelector('#header-container header');
      const mobileBtn = header?.querySelector('#mobile-menu-button');
      const mobileMenu = header?.querySelector('#mobile-menu');
      mobileBtn?.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));

     // Hide header once you leave the top; only show again at the very top
     const onScroll = () => {
       const y = window.scrollY;
       if (y <= 10) {
         header?.classList.remove('header-fade'); // visible at top
       } else {
         header?.classList.add('header-fade'); // hidden elsewhere
       }
     };
      onScroll();
      window.addEventListener('scroll', onScroll, { passive: true });
    })();

    // Ensure hero text appears
    document.addEventListener('DOMContentLoaded', () => {
      const hero = document.getElementById('hero-content');
      hero?.classList.add('visible');
      const arrow = document.getElementById('scroll-down');
      setTimeout(() => {
       arrow?.classList.add('visible');
     }, 1000); // delay arrow appearance by 1 seconds
    });

    // Bring back "NARRATIVE WORK" fade-in on scroll
    (function() {
      const title = document.getElementById('narrative-title');
      if (!title) return;
      const io = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) title.classList.add('visible');
        });
      }, { threshold: 0.25 });
      io.observe(title);

      // Reveal Client Work title on scroll
      const clientTitle = document.getElementById('client-title');
      if (clientTitle) {
        const io2 = new IntersectionObserver(entries => {
          entries.forEach(e => {
            if (e.isIntersecting) clientTitle.classList.add('visible');
          });
        }, { threshold: 0.25 });
        io2.observe(clientTitle);
      }
    })();

    // Scroll to Narrative section when arrow is clicked
    document.getElementById('scroll-down')?.addEventListener('click', () => {
      document.querySelector('#posters')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    // Keep homepage URL clean if someone lands on /index.html
    if (location.pathname.endsWith('/index.html')) {
      const cleaned = location.pathname.replace(/index\.html$/, '');
      history.replaceState(null, '', cleaned || '/');
    }
  </script>
</body>
  </script></body></html>
